server:
  port: 8082

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/minisiem}
    username: ${SPRING_DATASOURCE_USERNAME:minisiem}
    password: ${SPRING_DATASOURCE_PASSWORD:minisiem}
    driver-class-name: org.postgresql.Driver
    flyway:
      enabled: true
      locations: classpath:db/migration
      # Hardening
      validate-on-migrate: true
      clean-disabled: true
      out-of-order: false
      baseline-on-migrate: false


  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
