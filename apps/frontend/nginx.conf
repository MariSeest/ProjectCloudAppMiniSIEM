server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # ✅ FIX CHIAVE: qualsiasi rotta che non esiste come file
    #    (es. /login, /dashboard) → serve index.html
    #    React Router poi gestisce la navigazione lato client
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache lunga per i file JS/CSS con hash nel nome (es. index-OzpdW6CQ.js)
    location ~* \.(js|css|woff2?|ttf|eot|otf|svg|png|jpg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Nessuna cache per index.html
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}