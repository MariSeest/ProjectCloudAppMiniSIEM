spring.application.name=minisiem-backend
spring.datasource.url=${DB_URL:jdbc:postgresql://minisiem-postgres:5432/minisiem}
spring.datasource.username=${DB_USERNAME:minisiem}
spring.datasource.password=${DB_PASSWORD:minisiem123}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
jwt.secret=${JWT_SECRET:minisiemSecretKey2024VeryLongAndSecureKeyForJWTSigning}
jwt.expiration=${JWT_EXPIRATION:86400000}
server.port=8080
management.endpoints.web.exposure.include=health
logging.level.com.minisiem=INFO