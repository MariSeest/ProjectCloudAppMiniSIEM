server:
  port: 8080

spring:
  application:
    name: api-gateway

  data:
    redis:
      host: redis
      port: 6379

  cloud:
    gateway:
      routes:
        - id: incident
          uri: http://incident-service:8082
          predicates:
            - Path=/api/incidents/**

        - id: vulnerability
          uri: http://vulnerability-service:8081
          predicates:
            - Path=/api/vulnerabilities/**


management:
  endpoints:
    web:
      exposure:
        include: health,info