server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      # ✅ CORS gestito dal gateway (browser -> gateway)
      globalcors:
        add-to-simple-url-handler-mapping: true
        corsConfigurations:
          "[/**]":
            allowedOrigins:
              - "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true

      routes:
        - id: vulnerability-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/cves/**
          filters:
            # ✅ Evita che il downstream applichi CORS e risponda "Invalid CORS request"
            - RemoveRequestHeader=Origin

        - id: incident-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/incidents/**
          filters:
            - RemoveRequestHeader=Origin

management:
  endpoints:
    web:
      exposure:
        include: health,info
