server:
  port: 8083

spring:
  application:
    name: siem-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://minisiem-postgres:5432/minisiem}
    username: ${DB_USERNAME:minisiem}
    password: ${DB_PASSWORD:minisiem}
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false
    out-of-order: true

jwt:
  secret: ${JWT_SECRET:minisiemSecretKey2024VeryLongAndSecureKeyForJWTSigning}
  expiration: ${JWT_EXPIRATION:86400000}

management:
  endpoints:
    web:
      exposure:
        include: health,info