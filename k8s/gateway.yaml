apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: group-5
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: milume/minisiem-gateway:1.1
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_CONFIG_LOCATION
              value: "file:/config/application.yml"
            - name: JAVA_TOOL_OPTIONS
              value: "-Dreactor.netty.http.client.resolver=default"
          volumeMounts:
            - name: gateway-config
              mountPath: /config/application.yml
              subPath: application.yml
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: gateway-config
          configMap:
            name: gateway-config
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: group-5
spec:
  selector:
    app: gateway
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
