apiVersion: batch/v1
kind: Job
metadata:
  name: flyway-repair-incident
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: flyway
          image: flyway/flyway:11
          args:
            - -url=jdbc:postgresql://minisiem-postgres:5432/minisiem
            - -user=minisiem
            - -schemas=public
            - repair
          env:
            - name: FLYWAY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minisiem-secrets
                  key: db-password
