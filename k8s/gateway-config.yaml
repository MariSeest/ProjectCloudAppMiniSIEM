apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  namespace: group-5
data:
  application.yml: |
    server:
      port: 8080

    spring:
      application:
        name: api-gateway

      data:
        redis:
          host: redis
          port: 6379

      cloud:
        gateway:
          routes:
            - id: incident-service
              uri: http://incident-service:8082
              predicates:
                - Path=/api/incidents/**
              filters:
                - name: RequestRateLimiter
                  args:
                    keyResolver: "#{@ipKeyResolver}"
                    redis-rate-limiter.replenishRate: 5
                    redis-rate-limiter.burstCapacity: 10
                    redis-rate-limiter.requestedTokens: 1

            - id: vulnerability-service
              uri: http://vulnerability-service:8081
              predicates:
                - Path=/api/cves/**
              filters:
                - name: RequestRateLimiter
                  args:
                    keyResolver: "#{@ipKeyResolver}"
                    redis-rate-limiter.replenishRate: 3
                    redis-rate-limiter.burstCapacity: 6
                    redis-rate-limiter.requestedTokens: 1

    management:
      endpoints:
        web:
          exposure:
            include: health,info