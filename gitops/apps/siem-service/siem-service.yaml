apiVersion: apps/v1
kind: Deployment
metadata:
  name: siem-service
  namespace: group-5
  labels:
    app: siem-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: siem-service
  template:
    metadata:
      labels:
        app: siem-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: siem-service
          image: milume/minisiem-siem:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8083
          env:
            - name: DB_URL
              value: jdbc:postgresql://minisiem-postgres:5432/minisiem
            - name: DB_USERNAME
              value: minisiem
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minisiem-secrets
                  key: db-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: minisiem-secrets
                  key: jwt-secret
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8083
            initialDelaySeconds: 60
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8083
            initialDelaySeconds: 90
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: siem-service
  namespace: group-5
  labels:
    app: siem-service
spec:
  selector:
    app: siem-service
  ports:
    - port: 8083
      targetPort: 8083
  type: ClusterIP

