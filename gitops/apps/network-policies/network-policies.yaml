# Default deny: blocca tutto il traffico in ingresso e uscita per default
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: group-5
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# Gateway: accetta ingresso dall'esterno (Cilium ingress), esce verso i microservizi e redis
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway
  namespace: group-5
spec:
  podSelector:
    matchLabels:
      app: gateway
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - {}
  egress:
    - podSelector:
        matchLabels:
          app: siem-service
    - podSelector:
        matchLabels:
          app: incident-service
    - podSelector:
        matchLabels:
          app: vulnerability-service
    - podSelector:
        matchLabels:
          app: redis
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
# siem-service: accetta solo dal gateway, esce verso postgres
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-siem-service
  namespace: group-5
spec:
  podSelector:
    matchLabels:
      app: siem-service
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - podSelector:
        matchLabels:
          app: gateway
  egress:
    - podSelector:
        matchLabels:
          app: minisiem-postgres
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
# incident-service: accetta solo dal gateway, esce verso postgres
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-incident-service
  namespace: group-5
spec:
  podSelector:
    matchLabels:
      app: incident-service
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - podSelector:
        matchLabels:
          app: gateway
  egress:
    - podSelector:
        matchLabels:
          app: minisiem-postgres
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
# vulnerability-service: accetta solo dal gateway, esce verso internet (OpenCTI)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-vulnerability-service
  namespace: group-5
spec:
  podSelector:
    matchLabels:
      app: vulnerability-service
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - podSelector:
        matchLabels:
          app: gateway
  egress:
    - ports:
        - port: 443
          protocol: TCP
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
# PostgreSQL: accetta solo da siem-service e incident-service
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgres
  namespace: group-5
spec:
  podSelector:
    matchLabels:
      app: minisiem-postgres
  policyTypes:
    - Ingress
  ingress:
    - podSelector:
        matchLabels:
          app: siem-service
    - podSelector:
        matchLabels:
          app: incident-service
---
# Redis: accetta solo dal gateway
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-redis
  namespace: group-5
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes:
    - Ingress
  ingress:
    - podSelector:
        matchLabels:
          app: gateway
---
# Frontend: accetta ingresso dall'esterno
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend
  namespace: group-5
spec:
  podSelector:
    matchLabels:
      app: frontend
  policyTypes:
    - Ingress
  ingress:
    - {}
