apiVersion: v1
kind: Service
metadata:
  name: {{ include "incident-service.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "incident-service.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "incident-service.selectorLabels" . | nindent 4 }}
  ports:
    - port: {{ .Values.port }}
      targetPort: {{ .Values.port }}
      protocol: TCP
      name: http
  type: ClusterIP