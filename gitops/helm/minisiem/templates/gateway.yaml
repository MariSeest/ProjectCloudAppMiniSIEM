apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  namespace: {{ .Values.namespace }}
  labels:
    app: gateway
    app.kubernetes.io/managed-by: Helm
data:
  application.yml: |
    server:
      port: {{ .Values.gateway.port }}
    spring:
      application:
        name: api-gateway
      data:
        redis:
          host: redis
          port: {{ .Values.redis.port }}
      cloud:
        gateway:
          routes:
            - id: vulnerability-service
              uri: http://vulnerability-service:{{ .Values.vulnerabilityService.port }}
              predicates:
                - Path=/api/cves/**
              filters:
                - RemoveRequestHeader=Origin
            - id: incident-service
              uri: http://incident-service:{{ .Values.incidentService.port }}
              predicates:
                - Path=/api/incidents/**,/api/correlation/**
              filters:
                - RemoveRequestHeader=Origin
            - id: siem-service
              uri: http://siem-service:{{ .Values.siemService.port }}
              predicates:
                - Path=/api/auth/**,/api/users/**,/api/dashboard/**,/api/acn/**,/api/audit/**,/api/falxdr/**,/api/identity/**,/api/events/**,/api/alerts/**,/api/ai/**
              filters:
                - RemoveRequestHeader=Origin
    management:
      endpoints:
        web:
          exposure:
            include: health,info
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ .Values.namespace }}
  labels:
    app: gateway
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: "{{ .Values.gateway.image.repository }}:{{ .Values.gateway.image.tag }}"
          imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.gateway.port }}
          env:
            - name: SPRING_CONFIG_LOCATION
              value: "file:/config/application.yml"
          volumeMounts:
            - name: config
              mountPath: /config/application.yml
              subPath: application.yml
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: {{ .Values.gateway.port }}
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: gateway-config
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: {{ .Values.namespace }}
  labels:
    app: gateway
spec:
  selector:
    app: gateway
  ports:
    - port: {{ .Values.gateway.port }}
      targetPort: {{ .Values.gateway.port }}
  type: ClusterIP
