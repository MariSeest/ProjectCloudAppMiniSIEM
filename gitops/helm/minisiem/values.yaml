# MiniSIEM v2 — Helm Umbrella Chart Values
# Tutti i valori configurabili per il deployment completo

namespace: group-5

# ─── Frontend ───────────────────────────────────────────────
frontend:
  enabled: true
  image:
    repository: milume/minisiem-frontend
    tag: latest
    pullPolicy: Always
  replicas: 1
  port: 80
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "200m"
      memory: "128Mi"

# ─── API Gateway ────────────────────────────────────────────
gateway:
  enabled: true
  image:
    repository: milume/minisiem-gateway
    tag: latest
    pullPolicy: Always
  replicas: 1
  port: 8080
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

# ─── siem-service ───────────────────────────────────────────
siemService:
  enabled: true
  image:
    repository: milume/minisiem-siem
    tag: latest
    pullPolicy: Always
  replicas: 1
  port: 8083
  env:
    dbUrl: jdbc:postgresql://minisiem-postgres:5432/minisiem
    dbUsername: minisiem
  resources:
    requests:
      cpu: "200m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"

# ─── incident-service ───────────────────────────────────────
incidentService:
  enabled: true
  image:
    repository: milume/minisiem-incident-service
    tag: latest
    pullPolicy: Always
  replicas: 1
  port: 8082
  env:
    dbUrl: jdbc:postgresql://minisiem-postgres:5432/minisiem
    dbUsername: minisiem
  resources:
    requests:
      cpu: "200m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"

# ─── vulnerability-service ──────────────────────────────────
vulnerabilityService:
  enabled: true
  image:
    repository: milume/minisiem-vulnerability-service
    tag: latest
    pullPolicy: Always
  replicas: 1
  port: 8081
  env:
    openctiUrl: https://placeholder.lhr.life/graphql
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

# ─── Redis ──────────────────────────────────────────────────
redis:
  enabled: true
  image:
    repository: redis
    tag: 7-alpine
    pullPolicy: IfNotPresent
  replicas: 1
  port: 6379
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "200m"
      memory: "256Mi"

# ─── PostgreSQL ─────────────────────────────────────────────
postgres:
  enabled: true
  image:
    repository: postgres
    tag: 16-alpine
    pullPolicy: IfNotPresent
  replicas: 1
  port: 5432
  database: minisiem
  username: minisiem
  storage: 5Gi
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

# ─── Secrets (riferimenti) ──────────────────────────────────
secrets:
  name: minisiem-secrets
