apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  namespace: group-5
data:
  application.yml: |
    server:
      port: 8080
    spring:
      application:
        name: api-gateway
      data:
        redis:
          host: redis
          port: 6379
      cloud:
        gateway:
          routes:
            - id: vulnerability-service
              uri: http://vulnerability-service:8081
              predicates:
                - Path=/api/cves/**
              filters:
                - RemoveRequestHeader=Origin
            - id: incident-service
              uri: http://10.109.184.67:8082
              predicates:
                - Path=/api/incidents/**,/api/correlation/**
              filters:
                - RemoveRequestHeader=Origin
            - id: siem-service
              uri: http://siem-service:8083
              predicates:
                - Path=/api/auth/**,/api/users/**,/api/dashboard/**,/api/acn/**,/api/audit/**,/api/falxdr/**,/api/identity/**,/api/events/**,/api/alerts/**,/api/ai/**
              filters:
                - RemoveRequestHeader=Origin
    management:
      endpoints:
        web:
          exposure:
            include: health,info
