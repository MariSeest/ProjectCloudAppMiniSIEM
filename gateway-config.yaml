apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  namespace: group-5
data:
  application.yml: |
    server:
      port: 8080

    spring:
      application:
        name: api-gateway
      data:
        redis:
          host: redis
          port: 6379
      cloud:
        gateway:
          routes:
            - id: incident-service
              uri: http://incident-service:8082
              predicates:
                - Path=/api/incidents/**,/api/auth/**,/api/correlation/**,/api/opencti/**
              filters:
                - RemoveRequestHeader=Origin

            - id: vulnerability-service
              uri: http://vulnerability-service:8081
              predicates:
                - Path=/api/cves/**
              filters:
                - RemoveRequestHeader=Origin

    management:
      endpoints:
        web:
          exposure:
            include: health,info